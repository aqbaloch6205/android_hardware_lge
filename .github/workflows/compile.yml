name: LG V60 Universal Hardware Build
on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  standalone-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Hardware Source
        uses: actions/checkout@v4
        with:
          path: hardware/lge

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git repo python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Minimal AOSP Environment
        run: |
          mkdir aosp && cd aosp
          git config --global user.email "build@example.com"
          git config --global user.name "Builder"
          
          # Initialize LineageOS 22.1 (Android 15)
          repo init -u https://github.com/LineageOS/android.git -b lineage-22.1 --depth=1
          
          # SYNCING THE ENGINE: Added vendor/lineage and build/soong
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle \
            build/make \
            build/soong \
            vendor/lineage \
            system/core \
            system/libhidl \
            system/libhwbinder \
            system/logging \
            hardware/interfaces \
            prebuilts/clang/host/linux-x86

      - name: Link Source and Compile
        run: |
          cd aosp
          ln -s ../hardware/lge hardware/lge
          
          # This will now work because vendor/lineage exists!
          source build/envsetup.sh
          
          # Use a generic target to set up the architecture
          lunch lineage_arm64-userdebug
          
          # Build your universal service
          mma lge_hardware_standalone_service -j$(nproc)

      - name: Upload Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: LGE-Hardware-Standalone
          path: aosp/out/target/product/*/vendor/bin/hw/lge_hardware_standalone_service
          